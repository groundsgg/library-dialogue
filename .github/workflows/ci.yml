name: Public dialogue build
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-consumers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew check publishAllPublicationsToReviewRepository :dialogue-cli:distZip
      - run: python3 tools/verify_public_artifacts.py
      - run: python3 tools/check_dialogue_major_candidate.py --check --repository .evidence/maven --version 0.1.0-SNAPSHOT
      - run: python3 -m unittest discover -s tools -p '*_test.py'
      - name: Verify fresh local Maven and ZIP consumers
        run: >-
          python3 tools/verify_dialogue_release.py
          --repository "file:${{ github.workspace }}/.evidence/maven"
          --version 0.1.0-SNAPSHOT
          --cli-zip dialogue-cli/build/distributions/dialogue-cli-0.1.0-SNAPSHOT.zip
          --work-dir .evidence/local-consumers --allow-local-review
      - run: python3 tools/check_dialogue_compatibility.py --binary-consumers --repository .evidence/maven --version 0.1.0-SNAPSHOT
      - name: Run credential-free Minestom application and protocol smoke
        run: |
          ./gradlew -p examples/standalone-minestom test installDist run --args=--smoke "-PdialogueRepository=file:${GITHUB_WORKSPACE}/.evidence/maven"
          python3 tools/minestom_smoke.py --profile public-26.2 --active-shutdown
      - run: ./gradlew :examples:headless-dialogue:run --args=--smoke
      - run: ./gradlew :examples:headless-dialogue:run --args=--presentation-smoke

  personal-npc-consumer:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew publishAllPublicationsToReviewRepository
      - name: Test selected NPC integration with actual personal actors
        run: |
          ./gradlew -p fixtures/npc-dialogue-consumer test installDist run --args=--smoke "-PdialogueRepository=file:${GITHUB_WORKSPACE}/.evidence/maven"
          python3 tools/verify_public_artifacts.py
          python3 tools/minestom_smoke.py --profile public-26.2 --consumer npc --active-shutdown

  cli-launchers:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew :dialogue-cli:test :dialogue-cli:distZip
      - name: Verify native Windows batch invocation
        if: runner.os == 'Windows'
        run: python -m unittest discover -s tools -p check_cli_distribution_test.py -k windowsBatchLauncher
      - name: Run actual standalone launcher with spaces and Unicode
        run: >-
          python tools/check_cli_distribution.py
          --zip dialogue-cli/build/distributions/dialogue-cli-0.1.0-SNAPSHOT.zip
          --version 0.1.0-SNAPSHOT
          --author-root examples/headless-dialogue/src/main/resources
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: cli-test-results-${{ matrix.os }}
          path: dialogue-cli/build/test-results
