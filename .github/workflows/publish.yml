name: Publish Release Packages
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  publish:
    uses: groundsgg/.github/.github/workflows/gradle-publish.yml@main
    permissions:
      contents: read
      packages: write
  cli-assets:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Build the tagged CLI version and upload release assets
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          ./gradlew :dialogue-cli:distZip -PversionOverride="$version"
          python3 tools/check_cli_distribution.py --zip "dialogue-cli/build/distributions/dialogue-cli-${version}.zip" --version "$version" --author-root examples/headless-dialogue/src/main/resources
          cd dialogue-cli/build/distributions
          sha256sum "dialogue-cli-${version}.zip" > "dialogue-cli-${version}.zip.sha256"
          for attempt in 1 2 3 4 5 6; do
            if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then break; fi
            if [ "$attempt" = 6 ]; then exit 1; fi
            sleep 5
          done
          gh release upload "$GITHUB_REF_NAME" "dialogue-cli-${version}.zip" "dialogue-cli-${version}.zip.sha256" --clobber
  verify-published-consumers:
    needs: [publish, cli-assets]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    env:
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Download and verify the actual release through fresh consumers
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p .evidence/release
          gh release download "$GITHUB_REF_NAME" --pattern "dialogue-cli-${version}.zip" --pattern "dialogue-cli-${version}.zip.sha256" --dir .evidence/release
          (cd .evidence/release && sha256sum -c "dialogue-cli-${version}.zip.sha256")
          python3 tools/verify_dialogue_release.py --repository https://maven.pkg.github.com/groundsgg/library-dialogue --version "$version" --cli-zip ".evidence/release/dialogue-cli-${version}.zip" --work-dir .evidence/remote-consumers
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: release-consumer-evidence
          path: |
            .evidence/remote-consumers/*.log
            .evidence/remote-consumers/*.json
